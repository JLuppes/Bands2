{% extends "base.html" %} {% block title %} {{super()}} - {{album.AlbumName}} {% endblock %}
{% block content %}
<section>
<div class="container my-5">
<div class="band-focus p-5 text-center bg-body-secondary rounded-3">
<h1 class="text-body-emphasis">{{album.AlbumTitle}}</h1>
<p class="col-lg-8 mx-auto fs-5 text-muted">
<h4>Bands</h4>
<ul>
{% for o in album.ownership %}
<li>
<a href="{{url_for('view_band', id=o.band.BandID)}}">{{o.band.BandName}}</a> 
&nbsp;
<a href="{{ url_for('edit_ownership', id=o.OwnershipID) }}">Edit</a> |
<a href="{{ url_for('delete_ownership', id=o.OwnershipID) }}">Delete</a>
</li>
{% endfor %}
</ul>
</p>
</div>
</div>
</section>
{% endblock %}
