{% extends "base.html" %}
{% block title %} {{super()}} - Edit Ownership {% endblock %}
{% block content %}
<h2>Edit Ownership</h2>
<form method="post" id="ownershipForm">
    <input type="hidden" name="ownership_id" value={{ownership.OwnershipID}}>
    <label>Band:</label>
    <select name="bandid">
        <option value="">-- select band --</option>
        {% for band in bands %}
        <option
            {% if band.BandID==ownership.BandID %} selected {% endif %}
            value="{{ band.BandID }}">
            {{ band.BandName}}
        </option>
        {% endfor %}
    </select><br />
    <label>Album:</label>
    <select name="albumid">
        <option value="">-- select album --</option>
            {% for album in albums %}
        <option
            {% if album.AlbumID==ownership.AlbumID %} selected {% endif %}
            value="{{ album.AlbumID }}">
            {{album.AlbumTitle }}
        </option>
        {% endfor %}
    </select>
    <br />
    <button type="submit">Save Membership</button>
</form>
{% endblock %}
