{% extends "base.html" %}
{% block title %} {{super()}} - Add Album {% endblock %}
{% block content %}
<h2>Add Album</h2>
<form method="post">
    <div class="mb-3">
        <label for="albumtitle" class="form-label">Album Title:</label>
        <input type="text" id="albumtitle" name="albumtitle" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="releaseyear" class="form-label">Release Year:</label>
        <input type="number" id="releaseyear" name="releaseyear" class="form-control" required>
    </div>

    <fieldset class="mb-3">
        <legend class="form-label">Bands</legend>
        {% for band in bands %}
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="bandids"
                   id="band-{{ band.BandID }}" value="{{ band.BandID }}">
            <label class="form-check-label" for="band-{{ band.BandID }}">{{ band.BandName }}</label>
        </div>
        {% endfor %}
    </fieldset>

    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
