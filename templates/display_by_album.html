{% extends "base.html" %} {% block title %} {{super()}} - Albums {% endblock %}
{% block content %}
<h2>Albums</h2>
{% for album in albums %}
<section>
<h3>
<a href="{{url_for('view_album', id=album.AlbumID)}}">{{ album.AlbumTitle }}</a>
</h3>
<h4>Bands</h4>
<ul>
{% for m in album.ownership %}
<li>
<a href="{{url_for('view_band', id=m.band.BandID)}}">{{m.band.BandName}}</a>

&nbsp;
<a href="{{ url_for('edit_memberships', id=m.OwnershipID) }}">Edit</a> |
<a href="{{ url_for('delete_membership', id=m.OwnershipID) }}">Delete</a>
<br>
</li>
{% endfor %}
</ul>
</section>
<hr />
{% endfor %}
{% endblock %}
